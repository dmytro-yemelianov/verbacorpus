name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target (main publishes both domains)
        type: choice
        options: [all, non, root]
        default: all
        required: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node build.mjs
      - run: npm test

  pytest:
    name: Data pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  deploy:
    name: Publish pinned UPA and Verba
    needs: [test, pytest]
    # PRs never receive the private source key or deploy credentials.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Read the reviewed UPA revision
        id: upa
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const { revision } = JSON.parse(fs.readFileSync('app/content/upa-release.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(revision)) throw new Error('Expected a pinned UPA commit');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'revision=' + revision + '\n');
          JS
      - name: Check out private UPA with a read-only deploy key
        uses: actions/checkout@v4
        with:
          repository: dmytro-yemelianov/upa-archive
          ref: ${{ steps.upa.outputs.revision }}
          path: .upa-source
          ssh-key: ${{ secrets.UPA_DEPLOY_KEY }}
          persist-credentials: false
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
        working-directory: .upa-source
      - name: Verify the UPA source before deployment
        run: pnpm lint && pnpm exec tsc --noEmit && pnpm site:check && pnpm test
        working-directory: .upa-source
      - run: pnpm site:build --sources
        working-directory: .upa-source
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Install Chromium for integrated browser checks
        run: pnpm exec playwright install --with-deps chromium
        working-directory: .upa-source
      - name: Verify all directions and mounted tools in Chromium
        run: pnpm test:verba
        working-directory: .upa-source
        env:
          VERBA_REPO: ${{ github.workspace }}
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integrated-browser-failures
          path: .upa-source/test-results/verba
          if-no-files-found: ignore
      - name: Verify canonical direction domains
        run: node scripts/ensure-domains.mjs
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Publish the UPA service first
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: .upa-source
          wranglerVersion: "4.153.0"
          command: deploy --config site/wrangler.jsonc
      # Use the locked CLI and update code on the existing domain; no zone access.
      - name: Publish the umbrella on main updates
        if: github.event_name != 'workflow_dispatch' || inputs.target != 'non'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx --no-install wrangler versions upload --config wrangler.jsonc --tag "$RELEASE_TAG"
          npx --no-install wrangler versions deploy --config wrangler.jsonc --version-tag "$RELEASE_TAG@100%" --yes
      - name: Publish non.verba on main updates
        if: github.event_name != 'workflow_dispatch' || inputs.target != 'root'
        working-directory: app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          npx --no-install wrangler versions upload --config wrangler.non.jsonc --tag "$RELEASE_TAG"
          npx --no-install wrangler versions deploy --config wrangler.non.jsonc --version-tag "$RELEASE_TAG@100%" --yes
      - name: Verify canonical sites, editor and API
        run: |
          for host in verbacorpus.org pro.verbacorpus.org contra.verbacorpus.org re.verbacorpus.org para.verbacorpus.org non.verbacorpus.org; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors "https://$host/" > /dev/null
          done
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://para.verbacorpus.org/letters-lab > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors https://non.verbacorpus.org/upa/page-frames > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors 'https://non.verbacorpus.org/upa/api/v1/patterns?limit=1' > /dev/null
